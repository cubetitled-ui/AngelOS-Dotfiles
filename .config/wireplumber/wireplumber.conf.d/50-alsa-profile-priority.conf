# WirePlumber rule to permanently prioritize analog stereo over pro-audio for Intel PCH
device.profile.priority.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.pci-0000_00_1f.*"
      }
    ]
    actions = {
      update-props = {
        priorities = [
          "output:analog-stereo+input:analog-stereo",
          "output:analog-stereo",
          "input:analog-stereo",
          "pro-audio"
        ]
      }
    }
  }
]
